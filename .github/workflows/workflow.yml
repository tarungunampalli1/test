# Run E2E tests on the pull request, if it matches with specific label or file changes we'd like to observe.
name: workflow

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  get-issue:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -Os https://github.com/yshavit/mdq/releases/download/v0.5.0/mdq-ubuntu.zip
          ls
          unzip mdq-ubuntu.zip
          chmod +x mdq

      - name: test script
        uses: actions/github-script@v7
        id: set-result
        with:
          result-encoding: string
          script: |
            const response = await github.rest.issues.get({
               issue_number: 7,
               owner: context.repo.owner,
               repo: context.repo.repo,
             });
            const body = response.data.body;
            return body

      - name: Parse body
        run: |
          echo "${{steps.set-result.outputs.result}}"
          echo "${{steps.set-result.outputs.result}}" | mdq -q '- [x]'
